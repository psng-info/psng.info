description:
  de: Psychedelische Behandlungen gelten zunehmend als reine Medikamententherapie, die Psychotherapie nur als Beiwerk. Max Wolff zeigt anhand einer großen Psilocybin-Studie zu Depression, warum Beziehung und psychotherapeutische Prozesse für den Behandlungserfolg zentral sind – und Psychedelika eher Werkzeuge der Psychotherapie sein könnten.
  en: Psychedelic treatments are increasingly seen as drug-based interventions, with psychotherapy as a mere add-on. Drawing on a large psilocybin trial for depression, Max Wolff argues that the therapeutic relationship and psychotherapeutic processes are central to treatment success – and that psychedelics may be better understood as tools for psychotherapy.
