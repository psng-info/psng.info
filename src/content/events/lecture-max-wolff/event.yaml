speakerBio:
  de: Max Wolff ist Psychologe, Psychotherapeut und Clinician Scientist an der Humboldt-Universität zu Berlin. Seine Forschung verbindet Psychedelika- und Psychotherapieforschung und untersucht psychologische Veränderungsprozesse in veränderten Bewusstseinszuständen. Als Forscher und Therapeut hat er an mehreren klinischen Studien in diesem Feld mitgewirkt und setzt sich für die Weiterentwicklung professioneller Ausbildungsprogramme in psychedelischer Therapie ein.
  en: Max Wolff is a psychologist, psychotherapist and clinician-scientist at Humboldt University Berlin, Germany. His research bridges psychedelic and psychotherapy research and explores psychological change processes associated with altered states of consciousness. He has contributed as a researcher and therapist to several clinical trials in the field and is committed to advancing professional training programs in psychedelic therapy.
abstract:
  lang: en
  title: The Case for Considering Psychedelics as Psychotherapeutic Tools
  text: |-
    Psychedelic treatments for mental health conditions such as depression are increasingly viewed as primarily drug-based interventions, with psychotherapy (often misrepresented as “psychological support”) playing only a supportive or even dispensable role. However, growing evidence suggests that psychological processes, including the relationship between patient and therapist and psychotherapeutic aspects of the psychedelic experience, are central to treatment success. Drawing on findings from a large clinical trial of psilocybin for depression, this talk will explore how psychedelics may be better understood as tools that enable or enhance psychotherapy rather than as treatments in their own right. Using an analogy with anesthetics, i.e., another class of adjunctive drugs that facilitate various treatments by exerting potent effects on consciousness, I will also discuss how this perspective could fit within existing drug regulation.
